<style>
        body {
            background-color: #F9FAFB; /* Level 0 Background per style guidance */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        }

            background: rgba(255, 255, 255, 0.95);

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);

<body class="min-h-screen flex items-center justify-center p-md">
<!-- Main Shell: Linear/Transactional - Nav is suppressed per "The Destination Rule" -->
<main class="w-full max-w-[480px] animate-in fade-in duration-700 slide-in-from-bottom-4">
<!-- Logo and Brand Header -->
<div class="flex flex-col items-center mb-xl">
<img alt="Academia Logo" class="h-12 w-auto mb-md object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsWZ9Nltl1JMLNfbrSIC6syVoe_EISFh9gjfEfrSg93dIqyFqwLqIv0wz9uUlRKsaVSRLHJk947AiPxQV0D03kQ313fOKMyDLujQAbtIcKpz-jntEgJFowlJ2vW7XAe-XHD5T6FeYdIRnhpgElfo3XFe7g5ezVUQvdftCh0ZFkHSh1u7968v0dMMyhVZ-YI_3hR0sWegy_TJgllvVg2gDTYFOkoP_EXMaqU5ZbYVaAjVFvUKyI83AJVOT4"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-xs">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start organizing your academic journey today</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.05),0_1px_2px_0_rgba(0,0,0,0.03)] p-lg md:p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Full Name Field -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="fullname">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full pl-xl pr-md py-md bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary-container input-ring transition-all" id="fullname" name="fullname" placeholder="Alex Rivers" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-xl pr-md py-md bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary-container input-ring transition-all" id="email" name="email" placeholder="alex.rivers@university.edu" required="" type="email"/>
</div>
</div>
<!-- Passwords Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-xl pr-md py-md bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary-container input-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="confirm_password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">shield_lock</span>
<input class="w-full pl-xl pr-md py-md bg-transparent border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary-container input-ring transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-md py-xs">
<input class="mt-1 w-4 h-4 text-primary-container border-outline-variant rounded focus:ring-primary-container" id="terms" type="checkbox"/>
<label class="font-body-md text-[13px] leading-tight text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Sign Up Button -->
<button class="w-full bg-primary-container text-on-primary font-button text-button py-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-sm" type="submit">
                    Create Account
                    <span class="material-symbols-outlined !text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Social Divider -->
<div class="relative my-xl">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm font-label-sm">
<span class="bg-surface-container-lowest px-md text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- Social Links -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm px-md py-md border border-outline-variant rounded-lg font-button text-button text-on-surface hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center gap-sm px-md py-md border border-outline-variant rounded-lg font-button text-button text-on-surface hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path>
</svg>
                    GitHub
                </button>
</div>
</div>
<!-- Footer Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</div>
</main>
<!-- Simple Atmospheric Interaction -->
<script>
        // Subtle interaction for input icons
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.previousElementSibling;
                if (icon) {
                    icon.classList.remove('text-outline-variant');
                    icon.classList.add('text-primary-container');
                }
            });
            input.addEventListener('blur', () => {
                const icon = input.previousElementSibling;
                if (icon) {
                    icon.classList.remove('text-primary-container');
                    icon.classList.add('text-outline-variant');
                }
            });
        });

        // Simple button active state visual
        const btn = document.querySelector('button[type="submit"]');
        btn.addEventListener('mousedown', () => btn.classList.add('scale-[0.98]'));
        btn.addEventListener('mouseup', () => btn.classList.remove('scale-[0.98]'));
    </script>
</body></html>
