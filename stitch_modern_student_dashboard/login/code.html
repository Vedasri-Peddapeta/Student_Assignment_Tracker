<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-md">
<!-- Login Container -->
<main class="w-full max-w-[1100px] grid grid-cols-1 lg:grid-cols-2 bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.05),0_1px_2px_0_rgba(0,0,0,0.03)] border border-outline-variant overflow-hidden animate-fade-in">

<section class="order-1 lg:order-2 bg-surface-container-low flex items-center justify-center p-xl relative overflow-hidden">
<!-- Animated Background Element -->
<div class="absolute inset-0 opacity-30 pointer-events-none">
<div class="absolute -top-20 -right-20 w-64 h-64 bg-secondary-container rounded-full blur-3xl"></div>
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary-fixed rounded-full blur-3xl"></div>
</div>

<!-- Brand Identity -->
<header class="mb-lg animate-fade-in delay-100">
<div class="flex items-center gap-sm mb-md">
<img alt="Academia Logo" class="h-10 w-auto" src="https://lh3.googleusercontent.com/aida/AP1WRLsWZ9Nltl1JMLNfbrSIC6syVoe_EISFh9gjfEfrSg93dIqyFqwLqIv0wz9uUlRKsaVSRLHJk947AiPxQV0D03kQ313fOKMyDLujQAbtIcKpz-jntEgJFowlJ2vW7XAe-XHD5T6FeYdIRnhpgElfo3XFe7g5ezVUQvdftCh0ZFkHSh1u7968v0dMMyhVZ-YI_3hR0sWegy_TJgllvVg2gDTYFOkoP_EXMaqU5ZbYVaAjVFvUKyI83AJVOT4"/>
<span class="font-headline-md text-headline-md text-primary tracking-tight">Academia</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Organize Your Academic Life</h1>
<p class="font-body-md text-body-md text-on-surface-variant">The smart way to track assignments and deadlines.</p>
</header>
<!-- Login Form -->
<form class="space-y-md animate-fade-in delay-200" onsubmit="return false;">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="notion-input w-full pl-10 pr-md py-[10px] rounded-lg border border-outline-variant bg-surface text-body-md font-body-md transition-all" id="email" placeholder="alex.rivers@university.edu" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="notion-input w-full pl-10 pr-md py-[10px] rounded-lg border border-outline-variant bg-surface text-body-md font-body-md transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Remember me</label>
</div>
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-button text-button py-[12px] rounded-lg shadow-sm hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Log in
                </button>
</form>
<!-- Social Login / Divider -->
<div class="my-lg flex items-center gap-md">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm text-outline">OR CONTINUE WITH</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-[10px] px-md border border-outline-variant rounded-lg bg-surface hover:bg-surface-container-low active:scale-95 transition-all">

<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-button text-button text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-[10px] px-md border border-outline-variant rounded-lg bg-surface hover:bg-surface-container-low active:scale-95 transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z" fill="currentColor"></path>
</svg>
<span class="font-button text-button text-on-surface">GitHub</span>
</button>

<!-- Footer Link -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign up</a>
</p>
</footer>
</section>
</main>
<!-- Simple Utility Footer -->
<div class="mt-lg text-outline font-label-sm text-label-sm space-x-md">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
</div>
<!-- Micro-interactions Script -->
<script>
        // Subtle input focus animation reinforcement
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Demo login action
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            setTimeout(() => {
                loginBtn.innerHTML = 'Log in';
            }, 1500);
        });
    </script>
</body></html>
